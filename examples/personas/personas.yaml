# Format sample. Seed lines must be written and reviewed by native speakers before release.
- kind: Persona
  spec_version: 1
  id: urdu_script
  version: 1.0.0
  status: draft
  reviewed_by: []
  label: Urdu script, simple everyday language
  language_style: { primary: urdu, script: arabic, english_mixing: low, switches_mid_sentence: false }
  literacy: medium
  register: polite
  noise_profile: light_urdu
  amount_styles: [digits_with_comma, urdu_words]
  date_styles: [relative, numeric]
  seed_lines:
    - "میرا کارڈ گم ہو گیا ہے، اسے بلاک کر دیں"
    - "پیسے کٹ گئے لیکن ٹرانسفر نہیں ہوا"
  forbidden: [mentions being an AI or a test]

- kind: Persona
  spec_version: 1
  id: roman_clean
  version: 1.0.0
  status: draft
  reviewed_by: []
  label: Clean Roman Urdu
  language_style: { primary: roman_urdu, script: latin, english_mixing: low, switches_mid_sentence: false }
  literacy: medium
  register: polite
