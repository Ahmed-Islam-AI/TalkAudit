- kind: Persona
  spec_version: 1
  id: english
  version: 1.0.0
  status: draft
  reviewed_by: []
  label: Pakistani English
  language_style: { primary: english, script: latin, english_mixing: none, switches_mid_sentence: false }
  literacy: high
  register: polite
  noise_profile: clean_english   # no noise operations; its lexicon holds the English amount and date renderings
  amount_styles: [rs_prefix, digits_with_comma]
  date_styles: [relative, day_month]
  seed_lines:
    - "I lost my card, kindly block it"
    - "Money has been deducted but the transfer did not go through"
