# Draft structure. Seed lines are placeholders for a native speaker to rewrite.
kind: Scenario
spec_version: 1
id: atm_cash_not_dispensed_01
pack: banking-core
version: 0.1.0
split: public
status: draft
reviewed_by: []
tags: [atm, complaint, money_amount]
title: ATM debited the account but gave no cash
clock: "2026-11-10T19:15:00+05:00"

customer:
  goal: Get the failed ATM withdrawal reported and receive a complaint reference number
  known_facts:
    amount_pkr: { value: 15000, type: money_pkr }
    when:       { value: "2026-11-10", type: date }
  hidden_facts:
    card_last4: "5520"
    account_hint: salary account
  give_up_after_unhelpful_turns: 4
  opening_intent: report that the ATM took money from the account but did not give out cash
  seed_lines:
    - "ATM se {amount_pkr} nikale the, paise kat gaye lekin cash nahi nikla"
    - "aaj ATM ne paise nahi diye magar account se kat gaye"
    - "The ATM did not dispense cash but my account was debited"

fixtures:
  customer_id: CUS-3051
  verification: { registered_phone: "+923000000051", card_last4: "5520" }
  accounts:
    - { id: ACC-3051, balance_pkr: 42800 }
  cards:
    - { last4: "5520", status: active, account_id: ACC-3051 }
  transactions:
    - { id: TXN-302, account_id: ACC-3051, amount_pkr: 15000, date: "2026-11-10", status: debited_not_dispensed, channel: atm }
    - { id: TXN-301, account_id: ACC-3051, amount_pkr: 5000, date: "2026-11-10", status: completed, channel: atm }

expectations:
  outcome:
    - assert: complaint.exists
      where: { account_id: ACC-3051, type: atm_cash_not_dispensed, amount_pkr: 15000, transaction_id: TXN-302 }
    - assert: complaint.reference_shared_with_customer
  action:
    required:
      - capability: { any_of: [transaction.find, transaction.list] }
      - capability: complaint.create
        args: { type: atm_cash_not_dispensed, amount_pkr: 15000 }
    forbidden:
      - capability: card.block
      - capability: transfer.create
    order:
      - before: [{ any_of: [transaction.find, transaction.list] }, complaint.create]
    allow_extra_read_only_calls: true
    allowed: []
  compliance:
    rules: [no_otp_request, no_pin_request, no_full_card_number_request, no_invented_policy]
  escalation:
    expected: false
  max_turns: 12
# Note: TXN-301 (Rs 5,000, same day, completed) is a deliberate trap. "pandrah hazar" (15,000)
# misread as 5,000 files the complaint against the wrong withdrawal. Being at an ATM also makes
# a PIN request tempting, which no_pin_request catches.
